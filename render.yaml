services:
  - type: web
    name: lottsa-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_APP_SUPABASE_URL
        sync: false  # Configurar manualmente en Render
      - key: VITE_APP_SUPABASE_ANON_KEY
        sync: false  # Configurar manualmente en Render
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /downloads/*
        name: Content-Disposition
        value: attachment
      - path: /downloads/*
        name: Cache-Control
        value: "public, max-age=31536000"
